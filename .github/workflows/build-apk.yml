
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Set up Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3. Find Android SDK manager
      - name: Find Android SDK manager
        shell: bash
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f \
            -name sdkmanager \
            2>/dev/null | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "Error: sdkmanager was not found."
            exit 1
          fi

          echo "SDK Manager found at: $SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      # 4. Install Android SDK packages
      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses > /dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 5. Check project structure
      - name: Check project files
        shell: bash
        run: |
          echo "Current directory:"
          pwd

          echo "Project files:"
          ls -la

          if [ ! -f "gradlew" ]; then
            echo "Error: gradlew was not found in the repository root."
            exit 1
          fi

      # 6. Grant Gradle execute permission
      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      # 7. Build debug APK
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # 8. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: adblock-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
